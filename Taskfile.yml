# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  compare-branch-commits:
    desc: Show commits from a reference branch that are not in a target branch
    summary: |
      Prompts for a reference branch and a target branch, then shows commits that
      exist in the reference branch but not in the target branch.

      Use remote branch names like origin/master and origin/release-2026-04-02.
    interactive: true
    silent: true
    cmds:
      - |
        printf "Reference branch containing the commits to check from (ensure up-to-date): "
        read -r reference_branch

        printf "Target branch to compare against (ensure up-to-date): "
        read -r target_branch

        printf "Show per-commit file change stats? [y/N]: "
        read -r verbose_choice

        verbose_flag=""

        case "$verbose_choice" in
          y|Y|yes|YES)
            verbose_flag="--stat"
            ;;
        esac

        git fetch
        git log "$target_branch..$reference_branch" --oneline --no-merges --cherry-pick $verbose_flag

  create-agent-worktree:
    desc: Create an agent worktree in ../<repo>.worktrees for a branch name
    summary: |
      Creates a new worktree at ../<repo>.worktrees/BRANCH_NAME and a matching
      branch named agent/BRANCH_NAME from the current branch HEAD.
      The worktrees directory is created if it does not exist.

      Example: task create-agent-worktree BRANCH_NAME=my-task
    requires:
      vars: [BRANCH_NAME]
    vars:
      WORKTREES_DIR: '../{{base .USER_WORKING_DIR}}.worktrees'
    cmd: git worktree add {{.WORKTREES_DIR}}/{{.BRANCH_NAME}} -b agent/{{.BRANCH_NAME}} HEAD

  rm-agent-worktree:
    desc: Remove an agent worktree in ../<repo>.worktrees for a branch name
    summary: |
      Removes the worktree at ../<repo>.worktrees/BRANCH_NAME and then tries to
      delete the matching agent/BRANCH_NAME branch.

      Example: task rm-agent-worktree BRANCH_NAME=my-task
    requires:
      vars: [BRANCH_NAME]
    vars:
      WORKTREES_DIR: '../{{base .USER_WORKING_DIR}}.worktrees'
    cmds:
      - git worktree remove {{.WORKTREES_DIR}}/{{.BRANCH_NAME}}
      - cmd: git branch -d agent/{{.BRANCH_NAME}}
        ignore_error: true

